name: Daily Dashboard Update

on:
  schedule:
    # 每天美股收盘后（UTC 21:30）自动运行
    - cron: '30 21 * * 1-5'
  workflow_dispatch:   # 允许手动随时点击一键触发

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Generate dashboard with cross-validated data
        run: python generate_dashboard.py

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: 'team_LOL4T4MP44lKf9dRdDGCZtR7'
          vercel-project-id: 'prj_1cC0vY4BLDpSZNJZd0hD9S3g5Epa'
          vercel-args: '--prod'
