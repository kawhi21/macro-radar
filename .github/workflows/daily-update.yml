name: Daily Dashboard Update

on:
  schedule:
    # 每个工作日美股收盘后（UTC 21:30 = 北京时间次日 05:30）自动运行
    - cron: '30 21 * * 1-5'
  workflow_dispatch:   # 允许手动随时点击一键触发

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install yfinance pandas

      - name: Generate dashboard with cross-validated data
        run: python generate_dashboard.py

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: 'team_LOL4T4MP44lKf9dRdDGCZtR7'
          VERCEL_PROJECT_ID: 'prj_1cC0vY4BLDpSZNJZd0hD9S3g5Epa'
        run: |
          vercel deploy --prod --yes --token=$VERCEL_TOKEN
